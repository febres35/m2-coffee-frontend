version: '3.8'

services:
  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m2-coffee-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:8080/api
    volumes:
      # For development - mount source code
      - ./src:/app/src:ro
      - ./public:/app/public:ro
    depends_on:
      - backend
    networks:
      - coffee-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development Frontend (for hot reload)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: m2-coffee-frontend-dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8080/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - coffee-network
    profiles:
      - dev

  # Backend Service (placeholder for future backend implementation)
  backend:
    image: nginx:alpine
    container_name: m2-coffee-backend-placeholder
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=development
    networks:
      - coffee-network
    restart: unless-stopped
    # This is a placeholder - replace with actual backend service

  # Database (placeholder for future database implementation)
  database:
    image: postgres:15-alpine
    container_name: m2-coffee-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=m2_coffee
      - POSTGRES_USER=coffee_user
      - POSTGRES_PASSWORD=coffee_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - coffee-network
    restart: unless-stopped
    profiles:
      - db

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: m2-coffee-redis
    ports:
      - "6379:6379"
    networks:
      - coffee-network
    restart: unless-stopped
    profiles:
      - cache

volumes:
  postgres_data:
    driver: local

networks:
  coffee-network:
    driver: bridge